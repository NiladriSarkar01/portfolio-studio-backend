# ── Server ────────────────────────────────────────────────
server.port=8080

# ── CORS: allow React dev server ─────────────────────────
portfolio.cors.allowed-origins=http://localhost:5173,http://localhost:3000,http://localhost:4173

# ── JSON file storage (replaces the database) ────────────
# All data lives in JSON files inside this folder:
#   projects.json  resume.json  skills.json  profile.json  messages.json
# Missing files are created from the defaults bundled in src/main/resources/data/
portfolio.data-dir=${PORTFOLIO_DATA_DIR:./data}

# ── Spring Mail (Gmail SMTP example) ─────────────────────
# Replace with your real credentials, or use env vars:
#   MAIL_USER=yourname@gmail.com
#   MAIL_PASS=your-app-password
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USER:yourname@gmail.com}
spring.mail.password=${MAIL_PASS:your-app-password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# The email address that receives contact form submissions
portfolio.contact.recipient=${MAIL_USER:yourname@gmail.com}

# ── Logging ───────────────────────────────────────────────
logging.level.com.portfolio=DEBUG
